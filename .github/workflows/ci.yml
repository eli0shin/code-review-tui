name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        id: format-check
        run: bun run format
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Fix formatting and push
        if: steps.format-check.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bun run format:fix
          git add --update
          git commit -m "style: fix formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test
        env:
          GIT_EDITOR: 'true'

  native-artifacts:
    name: Start ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            artifact: review-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: review-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            artifact: review-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            artifact: review-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native artifact
        run: bun build src/cli.tsx --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      - name: Start native artifact
        run: ./${{ matrix.artifact }} --version
